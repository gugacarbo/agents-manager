[package]
name = "agents-manager-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
specta-typescript = "0.0.15"
thiserror = "2"
sha2 = "0.10"
regex = "1"
toml = "0.8"
toml_edit = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"

[package]
name = "agents-manager"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "agents_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agents-manager-adapters = { version = "0.1.0", path = "../crates/adapters" }
agents-manager-core = { version = "0.1.0", path = "../crates/core" }
directories = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "0.0.15"
tauri = { version = "2", features = [] }
tauri-specta = { version = "2.0.0-rc.29", features = ["typescript"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

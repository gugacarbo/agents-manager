[package]
name = "agents-manager"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "agents_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agents-manager-adapters = { version = "0.1.0", path = "../crates/adapters" }
agents-manager-core = { version = "0.1.0", path = "../crates/core" }
agents-manager-remote = { version = "0.1.0", path = "../crates/remote" }
directories = "6"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "0.0.15"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-specta = { version = "2.0.0-rc.29", features = ["typescript"] }

tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
agents-manager-claude-accounts = { version = "0.1.0", path = "../crates/claude-accounts" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
